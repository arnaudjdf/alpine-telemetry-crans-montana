<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIS Alpine WC Crans-Montana 2027 — Data Storytelling Demo</title>
<style>
  :root {
    --bg: #0b1220; --panel: rgba(12, 18, 32, .72); --line: rgba(255,255,255,.12);
    --text: #e8edf6; --dim: #8b97ad; --a: #ff7a1a; --b: #f4f7ff; --ok: #2ecc71; --bad: #ff4d4d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .panel { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(8px); padding: 12px 14px; }
  #title { top: 16px; left: 16px; max-width: 360px; }
  #title h1 { margin: 0; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
  #title p { margin: 4px 0 0; font-size: 12px; color: var(--dim); }
  #title .tag { display: inline-block; margin-top: 8px; font-size: 10px; letter-spacing: .1em; color: var(--a);
    border: 1px solid var(--a); border-radius: 4px; padding: 2px 6px; }
  #telemetry { top: 16px; right: 16px; width: 330px; }
  #clock { font-size: 34px; font-weight: 600; letter-spacing: .02em; }
  #clock small { font-size: 12px; color: var(--dim); margin-left: 6px; }
  .row { display: grid; grid-template-columns: 14px 1fr auto auto; gap: 10px; align-items: baseline; padding: 6px 0;
    border-top: 1px solid var(--line); font-size: 13px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; align-self: center; }
  .row .v { font-size: 20px; font-weight: 600; }
  .row .u { color: var(--dim); font-size: 11px; }
  #gap { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); display: flex; justify-content: space-between;
    align-items: baseline; font-size: 12px; color: var(--dim); }
  #gapv { font-size: 22px; font-weight: 700; }
  #splits { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; font-size: 12px; }
  #splits div { display: flex; justify-content: space-between; padding: 2px 0; color: var(--dim); }
  #splits div.on { color: var(--text); }
  #gaplabel { position: absolute; transform: translate(-50%, -140%); pointer-events: none; font-weight: 700; font-size: 15px;
    padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,.6); border: 1px solid currentColor; white-space: nowrap; }
  #bottom { left: 16px; right: 16px; bottom: 16px; display: flex; gap: 14px; align-items: center; }
  #timeline { position: relative; flex: 1; height: 28px; cursor: pointer; }
  #track { position: absolute; left: 0; right: 0; top: 12px; height: 4px; background: var(--line); border-radius: 2px; }
  #prog { position: absolute; left: 0; top: 12px; height: 4px; background: var(--a); border-radius: 2px; width: 0; }
  #cursor { position: absolute; top: 5px; width: 3px; height: 18px; background: #fff; border-radius: 2px; left: 0; }
  .mk { position: absolute; top: 0; transform: translateX(-50%); font-size: 10px; color: var(--dim); text-align: center; }
  .mk::after { content: ""; display: block; width: 1px; height: 10px; background: var(--dim); margin: 2px auto 0; }
  button { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px;
    cursor: pointer; font: inherit; font-size: 12px; }
  button:hover { border-color: var(--a); color: var(--a); }
  #help { font-size: 11px; color: var(--dim); white-space: nowrap; }
  kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 10px; }
  #replay { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 16px; padding: 12px 22px;
    display: none; background: var(--panel); border-color: var(--a); color: var(--a); }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--bg); color: var(--dim); font-size: 13px; }
  @media (max-width: 900px) { #telemetry { width: 260px; } #help { display: none; } #title { max-width: 220px; } }
</style>
</head>
<body>
<div id="loading">Generating terrain…</div>

<div id="title" class="panel">
  <h1>FIS Alpine WC Crans-Montana 2027</h1>
  <p>Data storytelling prototype — ghost traces, speed/gap ribbon, telemetry</p>
  <span class="tag">SYNTHETIC DATA · CONCEPT DEMO</span>
</div>

<div id="telemetry" class="panel mono">
  <div id="clock">0.00<small>s · <span id="rate">1.0×</span></small></div>
  <div class="row"><span class="dot" style="background:var(--a)"></span><span>#1 Orange</span><span class="v" id="vA">0</span><span class="u">km/h</span></div>
  <div class="row"><span class="dot" style="background:var(--b)"></span><span>#2 White</span><span class="v" id="vB">0</span><span class="u">km/h</span></div>
  <div id="gap"><span>GAP (#1 vs #2)</span><span id="gapv">0.00</span></div>
  <div id="splits"></div>
</div>

<div id="gaplabel" class="mono" style="display:none"></div>
<button id="replay">↻ Replay</button>

<div id="bottom" class="panel">
  <button id="play">Pause</button>
  <button id="rew">Rewind</button>
  <div id="timeline"><div id="track"></div><div id="prog"></div><div id="cursor"></div></div>
  <div id="help">
    <kbd>Space</kbd> play/pause · <kbd>R</kbd> rewind · <kbd>1</kbd><kbd>2</kbd> follow · <kbd>3</kbd> overview · <kbd>[</kbd><kbd>]</kbd> speed
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ==========================================================================
   1. Terrain model (procedural, a stand-in for swissALTI3D)
   Coordinates in metres. The course runs along +Z, from Z0 (start) to Z1 (finish).
   ========================================================================== */
// @SIM-BEGIN
const Z0 = -1400, Z1 = 1400;          // start / finish
const WIDTH = 2400, LENGTH = 3200;    // terrain extent
const DESCENT = 850;                  // total vertical drop (m)

const hash = (i, j) => { const n = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return n - Math.floor(n); };
const smooth = (t) => t * t * (3 - 2 * t);
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = smooth(x - xi), yf = smooth(y - yi);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * xf + (c - a) * yf + (a - b - c + d) * xf * yf;
}
function fbm(x, y) {
  let s = 0, amp = 1, f = 1, norm = 0;
  for (let o = 0; o < 5; o++) { s += amp * vnoise(x * f, y * f); norm += amp; amp *= 0.5; f *= 2; }
  return s / norm;
}
const centerline = (z) => 140 * Math.sin(z / 420) + 60 * Math.sin(z / 170);

/** Terrain height: overall descent + steeper/flatter sections + valley walls + noise (calm on the piste). */
function height(x, z) {
  const t = (z - Z0) / (Z1 - Z0);
  const base = DESCENT * (1 - t) + 55 * Math.sin(t * 9.0) + 25 * Math.sin(t * 23.0);
  const d = Math.abs(x - centerline(z));
  const wall = smooth(Math.min(1, Math.max(0, (d - 70) / 650)));
  const pisteMask = 1 - smooth(Math.min(1, d / 80));
  const noise = (fbm(x / 200, z / 200) - 0.5) * 140 * (1 - pisteMask) * (0.2 + 0.8 * wall);
  return base + wall * 320 + d * 0.12 * (1 - pisteMask) + noise;
}

/* ==========================================================================
   2. Synthetic trajectories (stand-in for the live LLAD feeds), 10 Hz
   ========================================================================== */
function simulate(cfg) {
  const dt = 0.1, S = { t: [], x: [], y: [], z: [], v: [] };
  let z = Z0, t = 0, v = cfg.base;
  while (z < Z1 && t < 400) {
    const g = -(height(centerline(z), z + 8) - height(centerline(z), z - 8)) / 16;       // downhill slope
    const target = cfg.base + cfg.gain * (g - 0.30) + cfg.wob * Math.sin(t * cfg.wf + cfg.ph);
    v += (Math.min(cfg.vmax, Math.max(60, target)) - v) * 0.08;                          // inertia
    const x = centerline(z) + cfg.amp * Math.sin(z * 2 * Math.PI / 120 + cfg.ph);       // gate line
    S.t.push(t); S.x.push(x); S.z.push(z); S.y.push(height(x, z) + 1.0); S.v.push(v);
    z += (v / 3.6) * dt * 0.97; t += dt;
  }
  return S;
}
const SK = [
  simulate({ base: 93, gain: 120, wob: 2.5, wf: 0.55, ph: 0.0, amp: 28, vmax: 135 }),
  simulate({ base: 92, gain: 260, wob: 3.0, wf: 0.50, ph: 1.1, amp: 23, vmax: 134 }),
];
/** Linear interpolation of a series at time t (clamped). */
function at(S, key, t) {
  const n = S.t.length, f = Math.min(n - 1, Math.max(0, t / 0.1)), i = Math.floor(f);
  const j = Math.min(n - 1, i + 1), a = f - i;
  return S[key][i] * (1 - a) + S[key][j] * a;
}
/** Time at which skier S reaches depth z (inverse of z(t), monotonic). */
function timeAtZ(S, z) {
  const n = S.z.length;
  if (z >= S.z[n - 1]) return S.t[n - 1];
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; (S.z[m] <= z ? lo = m : hi = m); }
  const a = (z - S.z[lo]) / (S.z[hi] - S.z[lo]);
  return S.t[lo] + a * (S.t[hi] - S.t[lo]);
}
/** Gap in seconds: > 0 means skier #1 is ahead of skier #2 at time t. */
function gapAt(t) { return timeAtZ(SK[1], at(SK[0], 'z', t)) - Math.min(t, SK[0].t.at(-1)); }
// @SIM-END

const DUR = Math.max(SK[0].t.at(-1), SK[1].t.at(-1));
const SPLITS = [0.2, 0.5, 0.8, 1.0].map((f, i) => {
  const z = Z0 + f * (Z1 - Z0), tA = timeAtZ(SK[0], z), tB = timeAtZ(SK[1], z);
  return { name: i < 3 ? `Split ${i + 1}` : 'Finish', z, tA, tB, gap: tB - tA };
});

/* ==========================================================================
   3. Three.js scene
   ========================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const SKY = new THREE.Color(0x0b1220);
scene.background = SKY;
scene.fog = new THREE.Fog(0x1a2438, 900, 4200);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 1, 8000);

scene.add(new THREE.HemisphereLight(0x8fb2ff, 0x1a2418, 0.45));
const sun = new THREE.DirectionalLight(0xffe2c0, 1.5);
sun.position.set(-900, 1200, 600);
scene.add(sun);

/* --- Terrain: displaced plane, vertex colours by altitude / slope / piste ----------------------- */
function buildTerrain() {
  const geo = new THREE.PlaneGeometry(WIDTH, LENGTH, 240, 320);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setY(i, height(pos.getX(i), pos.getZ(i)));
  geo.computeVertexNormals();
  const nrm = geo.attributes.normal, col = new Float32Array(pos.count * 3);
  const snow = new THREE.Color(0xf2f6ff), rock = new THREE.Color(0x5a5c63), forest = new THREE.Color(0x14281b), piste = new THREE.Color(0xffffff);
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i), ny = nrm.getY(i);
    const d = Math.abs(x - centerline(z));
    const rockiness = smooth(Math.min(1, Math.max(0, (0.86 - ny) / 0.2)));
    const treeline = smooth(Math.min(1, Math.max(0, (330 - y) / 160)));
    c.copy(snow).lerp(rock, rockiness);
    c.lerp(forest, treeline * (1 - rockiness * 0.6));
    c.lerp(piste, 1 - smooth(Math.min(1, d / 70)));
    const m = 0.9 + 0.2 * fbm(x / 25, z / 25);               // subtle mottling
    col[i * 3] = c.r * m; col[i * 3 + 1] = c.g * m; col[i * 3 + 2] = c.b * m;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0 }));
}
scene.add(buildTerrain());

/* --- Course furniture: gates, split lines, finish arch ---------------------------------------- */
function buildCourse() {
  const g = new THREE.Group();
  const poleGeo = new THREE.CylinderGeometry(0.25, 0.25, 4, 6);
  const red = new THREE.MeshStandardMaterial({ color: 0xd62828 }), blue = new THREE.MeshStandardMaterial({ color: 0x1d4ed8 });
  for (let z = Z0 + 60, k = 0; z < Z1 - 20; z += 60, k++) {
    const side = k % 2 ? -1 : 1, x = centerline(z) + side * 38;
    const p = new THREE.Mesh(poleGeo, side > 0 ? red : blue);
    p.position.set(x, height(x, z) + 2, z);
    g.add(p);
  }
  // Split lines across the piste
  SPLITS.forEach((s, i) => {
    const w = 130, plane = new THREE.Mesh(new THREE.PlaneGeometry(w, 14),
      new THREE.MeshBasicMaterial({ color: i < 3 ? 0xffb347 : 0xffffff, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false }));
    const x = centerline(s.z);
    plane.position.set(x, height(x, s.z) + 7, s.z);
    g.add(plane);
  });
  // Finish arch
  const zf = Z1, xf = centerline(zf), yf = height(xf, zf);
  const mat = new THREE.MeshStandardMaterial({ color: 0xff7a1a, emissive: 0x7a3000 });
  [-30, 30].forEach(dx => { const m = new THREE.Mesh(new THREE.BoxGeometry(2, 14, 2), mat); m.position.set(xf + dx, yf + 7, zf); g.add(m); });
  const beam = new THREE.Mesh(new THREE.BoxGeometry(62, 3, 2), mat); beam.position.set(xf, yf + 14, zf); g.add(beam);
  return g;
}
scene.add(buildCourse());

/* --- Skiers --------------------------------------------------------------------------------- */
const COLORS = [0xff7a1a, 0xf4f7ff];
const skierMesh = SK.map((_, i) => {
  const grp = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.9, 1.6, 4, 8), new THREE.MeshStandardMaterial({ color: COLORS[i], emissive: COLORS[i], emissiveIntensity: 0.35 }));
  body.scale.setScalar(1.6);
  grp.add(body);
  const beacon = new THREE.Mesh(new THREE.ConeGeometry(2.2, 7, 12), new THREE.MeshBasicMaterial({ color: COLORS[i] }));
  beacon.rotation.x = Math.PI; beacon.position.y = 11;
  grp.add(beacon);
  scene.add(grp);
  return grp;
});

/* --- Ghost traces (progressively revealed through drawRange) ----------------------------------- */
const traces = SK.map((S, i) => {
  const arr = new Float32Array(S.t.length * 3);
  S.t.forEach((_, k) => arr.set([S.x[k], S.y[k] + 0.6, S.z[k]], k * 3));
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  geo.setDrawRange(0, 0);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: COLORS[i], transparent: true, opacity: 0.8 }));
  line.frustumCulled = false;
  scene.add(line);
  return line;
});

/* --- Speed/gap ribbon: strip between the two skiers at the same instant, coloured by who leads ---- */
const N = SK[0].t.length;
const ribbon = (() => {
  const pos = new Float32Array(N * 6), col = new Float32Array(N * 6), idx = [];
  const green = new THREE.Color(0x2ecc71), red = new THREE.Color(0xff4d4d), c = new THREE.Color();
  for (let i = 0; i < N; i++) {
    const t = SK[0].t[i], j = Math.min(i, SK[1].t.length - 1);
    pos.set([SK[0].x[i], SK[0].y[i] + 3, SK[0].z[i], SK[1].x[j], SK[1].y[j] + 3, SK[1].z[j]], i * 6);
    const gap = timeAtZ(SK[1], SK[0].z[i]) - t;
    c.copy(gap >= 0 ? green : red).multiplyScalar(0.55 + 0.45 * Math.min(1, Math.abs(gap) / 1.5));   // intensity ~ |gap|
    col.set([c.r, c.g, c.b, c.r, c.g, c.b], i * 6);
    if (i < N - 1) idx.push(2 * i, 2 * i + 1, 2 * i + 2, 2 * i + 1, 2 * i + 3, 2 * i + 2);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.setIndex(idx);
  geo.setDrawRange(0, 0);
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.6, side: THREE.DoubleSide, depthWrite: false }));
  m.frustumCulled = false;
  scene.add(m);
  return m;
})();

/* --- Powder-snow particles (ring buffer, additive fade) ---------------------------------------- */
const PCOUNT = 700;
const particles = SK.map((_, i) => {
  const pos = new Float32Array(PCOUNT * 3).fill(-9999), col = new Float32Array(PCOUNT * 3), age = new Float32Array(PCOUNT).fill(9), vel = new Float32Array(PCOUNT * 3);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size: 1.1, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  pts.frustumCulled = false;
  scene.add(pts);
  return { pos, col, age, vel, geo, head: 0 };
});
function updateParticles(dt, positions, speeds, playing) {
  particles.forEach((p, i) => {
    if (playing) for (let k = 0; k < 4; k++) {                                // spawn
      const h = p.head; p.head = (p.head + 1) % PCOUNT;
      p.pos.set([positions[i].x + (Math.random() - .5) * 2, positions[i].y + 0.6, positions[i].z + (Math.random() - .5) * 2], h * 3);
      p.vel.set([(Math.random() - .5) * 6, 2 + Math.random() * 6, (Math.random() - .5) * 6 - speeds[i] * 0.05], h * 3);
      p.age[h] = 0;
    }
    for (let h = 0; h < PCOUNT; h++) {
      if (playing) {
        p.age[h] += dt;
        p.pos[h * 3] += p.vel[h * 3] * dt; p.pos[h * 3 + 1] += p.vel[h * 3 + 1] * dt; p.pos[h * 3 + 2] += p.vel[h * 3 + 2] * dt;
        p.vel[h * 3 + 1] -= 6 * dt;
      }
      const f = Math.max(0, 1 - p.age[h] / 1.4) * 0.8;
      p.col[h * 3] = p.col[h * 3 + 1] = p.col[h * 3 + 2] = f;
    }
    p.geo.attributes.position.needsUpdate = true; p.geo.attributes.color.needsUpdate = true;
  });
}

/* ==========================================================================
   4. HUD & controls
   ========================================================================== */
const $ = (id) => document.getElementById(id);
const fmt = (s, d = 2) => (s >= 0 ? '+' : '−') + Math.abs(s).toFixed(d);

// Split table + timeline markers
$('splits').innerHTML = SPLITS.map((s, i) => `<div id="sp${i}"><span>${s.name}</span><span class="mono">—</span></div>`).join('');
SPLITS.forEach((s) => {
  const m = document.createElement('div');
  m.className = 'mk'; m.style.left = (s.tA / DUR * 100) + '%'; m.textContent = s.name === 'Finish' ? 'FIN' : s.name.replace('Split ', 'S');
  $('timeline').appendChild(m);
});

let t = 0, playing = true, rate = 1, camMode = 0;
const setPlaying = (v) => { playing = v; $('play').textContent = v ? 'Pause' : 'Play'; };
const rewind = () => { t = 0; setPlaying(true); $('replay').style.display = 'none'; };
$('play').onclick = () => setPlaying(!playing);
$('rew').onclick = rewind; $('replay').onclick = rewind;
$('timeline').addEventListener('pointerdown', (e) => {
  const r = $('timeline').getBoundingClientRect();
  t = Math.min(DUR, Math.max(0, (e.clientX - r.left) / r.width * DUR));
  $('replay').style.display = 'none';
});
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'r' || e.key === 'R') rewind();
  else if (e.key === '1') camMode = 0;
  else if (e.key === '2') camMode = 1;
  else if (e.key === '3') camMode = 2;
  else if (e.key === '[') rate = Math.max(0.1, +(rate - 0.25).toFixed(2));
  else if (e.key === ']') rate = Math.min(4, +(rate + 0.25).toFixed(2));
});
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
});

/* ==========================================================================
   5. Main loop
   ========================================================================== */
const P = SK.map(() => new THREE.Vector3());
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
let camInit = false;
const clock = new THREE.Clock();
const tmp = new THREE.Vector3(), dir = new THREE.Vector3();

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (playing) {
    t += dt * rate;
    if (t >= DUR) { t = DUR; setPlaying(false); $('replay').style.display = 'block'; }
  }

  // Skier positions
  SK.forEach((S, i) => {
    const tt = Math.min(t, S.t.at(-1));
    P[i].set(at(S, 'x', tt), at(S, 'y', tt), at(S, 'z', tt));
    skierMesh[i].position.copy(P[i]).add(tmp.set(0, 1.5, 0));
    const idx = Math.min(S.t.length - 1, Math.floor(tt / 0.1));
    traces[i].geometry.setDrawRange(0, idx + 1);
  });
  ribbon.geometry.setDrawRange(0, Math.min(N - 1, Math.floor(Math.min(t, SK[0].t.at(-1)) / 0.1)) * 6);

  updateParticles(dt, P, SK.map((S) => at(S, 'v', Math.min(t, S.t.at(-1)))), playing && t < DUR);

  // Camera
  const target = camMode === 2 ? null : P[camMode];
  if (target) {
    const S = SK[camMode], tt = Math.min(t, S.t.at(-1));
    dir.set(at(S, 'x', Math.min(tt + 0.8, S.t.at(-1))) - P[camMode].x, 0, at(S, 'z', Math.min(tt + 0.8, S.t.at(-1))) - P[camMode].z);
    if (dir.lengthSq() < 1e-4) dir.set(0, 0, 1);
    dir.normalize();
    const desired = tmp.copy(P[camMode]).addScaledVector(dir, -80).add(new THREE.Vector3(0, 32, 0));
    const look = new THREE.Vector3().copy(P[camMode]).addScaledVector(dir, 50);
    if (!camInit) { camPos.copy(desired); camLook.copy(look); camInit = true; }
    const k = 1 - Math.exp(-dt * 2.2);
    camPos.lerp(desired, k); camLook.lerp(look, k);
  } else {
    const mid = P[0].clone().add(P[1]).multiplyScalar(0.5);
    const desired = new THREE.Vector3(mid.x + 520, mid.y + 360, mid.z - 520);
    const k = 1 - Math.exp(-dt * 1.5);
    camPos.lerp(desired, k); camLook.lerp(mid, k);
  }
  camera.position.copy(camPos);
  camera.lookAt(camLook);

  // HUD
  const gap = gapAt(t);
  $('clock').firstChild.nodeValue = t.toFixed(2);
  $('rate').textContent = rate.toFixed(2).replace(/0$/, '') + '×';
  $('vA').textContent = Math.round(at(SK[0], 'v', Math.min(t, SK[0].t.at(-1))));
  $('vB').textContent = Math.round(at(SK[1], 'v', Math.min(t, SK[1].t.at(-1))));
  const gv = $('gapv'); gv.textContent = fmt(gap); gv.style.color = gap >= 0 ? 'var(--ok)' : 'var(--bad)';
  SPLITS.forEach((s, i) => {
    const el = $('sp' + i), done = t >= s.tB;
    el.className = done ? 'on' : '';
    el.lastChild.textContent = done ? `${fmt(s.gap)} s` : t >= s.tA ? `#1 ${s.tA.toFixed(2)}` : '—';
    el.lastChild.style.color = done ? (s.gap >= 0 ? 'var(--ok)' : 'var(--bad)') : '';
  });
  const pct = t / DUR * 100;
  $('prog').style.width = pct + '%'; $('cursor').style.left = `calc(${pct}% - 1px)`;

  // Gap label pinned to ribbon midpoint
  const label = $('gaplabel');
  tmp.copy(P[0]).add(P[1]).multiplyScalar(0.5).add(new THREE.Vector3(0, 6, 0)).project(camera);
  if (tmp.z < 1 && t > 0.5) {
    label.style.display = 'block';
    label.style.left = ((tmp.x + 1) / 2 * innerWidth) + 'px';
    label.style.top = ((1 - tmp.y) / 2 * innerHeight) + 'px';
    label.textContent = fmt(gap) + ' s';
    label.style.color = gap >= 0 ? 'var(--ok)' : 'var(--bad)';
  } else label.style.display = 'none';

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

$('loading').style.display = 'none';
requestAnimationFrame(frame);
</script>
</body>
</html>
